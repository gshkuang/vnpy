# 策略配置文件
EquityDemoStrategy:
  name: "权益演示策略"
  class_name: "EquityDemoStrategy"
  module: "vnpy.alpha.strategy.strategies.equity_demo_strategy"
  default_params:
    top_k: 10
    n_drop: 3
    min_days: 3
  param_ranges:
    top_k: [3, 20, 1]      # [最小值, 最大值, 步长]
    n_drop: [1, 10, 1]    # [最小值, 最大值, 步长]
    min_days: [1, 5, 1]           # [最小值, 最大值, 步长]